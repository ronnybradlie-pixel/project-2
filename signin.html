<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header>
        <a class="brand" href="#">Flicker Watch</a>
         <div class="logo">FW</div>
    <div>
            <h1>Flicker Watch</h1>
            <div class="tag">Discover movies . Trailers</div>
    </div>

    <nav>
         <ul> 
             <li><a href="index.html" class="active">Home</a></li>
         </ul> 
         <div class="search"><input type="text" placeholder="search movies"></div>

       <button id="themeToggle" class="theme-btn">Light Mode</button>
    </nav>
    </header>

    <div class="container">
        <div class="card">
           <div class="register">
              <button id="loginBtn" class="active">Log In</button>
              <button id="signinBtn" class="active">Sign In</button>
           </div>
 <form id="loginForm" class="form active">
            <h2>Welcome Back</h2>

            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>

            <button type="submit" class="submit-btn">Login</button>
        </form>

        <form id="signupForm" class="form">
            <h2>Create Account</h2>

            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>

            <button type="submit" class="submit-btn">Sign Up</button>
        </form>

    </div>

</div>
    
</body>
</html>
